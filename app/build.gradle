plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Friendly error if the Firebase config file was not added yet.
if (!file('google-services.json').exists()) {
    throw new GradleException("app/google-services.json is missing. Create a Firebase project, register the package com.prohori.app, download google-services.json and put it inside the app folder. See SETUP_GUIDE.md")
}

android {
    namespace 'com.prohori.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.prohori.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Firebase (versions are controlled by the BoM)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
}
